apiVersion: apps/v1
kind: Deployment
metadata:
  name: placetrack-deployment
  labels:
    app: placetrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placetrack
  template:
    metadata:
      labels:
        app: placetrack
    spec:
      containers:
        - name: placetrack
          image: ghcr.io/skit-devops-2026/devops-24eskcs069:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
